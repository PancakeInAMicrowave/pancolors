<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Proportions</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="converter proportions-page">
    <a class="back-link" href="index.html">← RGB Converter</a>

    <h1>Color Proportions</h1>

    <div class="proportions-layout">
      <section class="proportion-card">
        <h2>Known relationship</h2>

        <div class="color-field">
          <label for="sourceInitialColor">Initial color</label>

          <div class="color-control">
            <input id="sourceInitialColor" type="color" value="#FF0000" />

            <div class="color-values">
              <label>
                HEX
                <input id="sourceInitialHex" type="text" value="#FF0000" maxlength="7" />
              </label>

              <label>
                RGB
                <input id="sourceInitialRgb" type="text" value="255, 0, 0" />
              </label>
            </div>
          </div>
        </div>

        <div class="happens">↓ Something happens ↓</div>

        <div class="color-field">
          <label for="sourceResultColor">Result color</label>

          <div class="color-control">
            <input id="sourceResultColor" type="color" value="#800000" />

            <div class="color-values">
              <label>
                HEX
                <input id="sourceResultHex" type="text" value="#800000" maxlength="7" />
              </label>

              <label>
                RGB
                <input id="sourceResultRgb" type="text" value="128, 0, 0" />
              </label>
            </div>
          </div>
        </div>
      </section>

      <section class="proportion-card">
        <h2>Color to convert</h2>

        <div class="color-field">
          <label for="targetInitialColor">Initial color</label>

          <div class="color-control">
            <input id="targetInitialColor" type="color" value="#0000FF" />

            <div class="color-values">
              <label>
                HEX
                <input id="targetInitialHex" type="text" value="#0000FF" maxlength="7" />
              </label>

              <label>
                RGB
                <input id="targetInitialRgb" type="text" value="0, 0, 255" />
              </label>
            </div>
          </div>
        </div>

        <div class="happens">↓ Apply relationship ↓</div>

        <div class="color-field">
          <label for="targetResultColor">Converted result</label>

          <div class="color-control">
            <input id="targetResultColor" type="color" value="#000080" readonly />

            <div class="color-values">
              <label>
                HEX
                <input id="targetResultHex" type="text" value="#000080" readonly />
              </label>

              <label>
                RGB
                <input id="targetResultRgb" type="text" value="0, 0, 128" readonly />
              </label>
            </div>
          </div>
        </div>
      </section>
    </div>

    <section class="mode-section">
      <label for="mode">Conversion mode</label>

      <select id="mode">
        <option value="percentile" selected>Percentile</option>
        <option value="absolute">Absolute</option>
      </select>

      <p id="modeDescription">
        Percentile applies the proportional change between the known colors.
      </p>
    </section>

    <div class="copy-result-row">
      <input id="resultRgb" type="text" readonly />
      <button id="copyResult" type="button">Copy RGB</button>
    </div>

    <div id="copyMessage" class="copy-message"></div>
  </main>

  <script>
    const colorGroups = [
      {
        color: "sourceInitialColor",
        hex: "sourceInitialHex",
        rgb: "sourceInitialRgb"
      },
      {
        color: "sourceResultColor",
        hex: "sourceResultHex",
        rgb: "sourceResultRgb"
      },
      {
        color: "targetInitialColor",
        hex: "targetInitialHex",
        rgb: "targetInitialRgb"
      }
    ];

    const mode = document.getElementById("mode");
    const modeDescription = document.getElementById("modeDescription");
    const targetResultColor = document.getElementById("targetResultColor");
    const targetResultHex = document.getElementById("targetResultHex");
    const targetResultRgb = document.getElementById("targetResultRgb");
    const resultRgb = document.getElementById("resultRgb");
    const copyMessage = document.getElementById("copyMessage");

    function clamp(value) {
      return Math.min(255, Math.max(0, Math.round(value)));
    }

    function normalizeHex(value) {
      value = value.trim();

      if (!value.startsWith("#")) {
        value = "#" + value;
      }

      if (/^#[0-9a-fA-F]{3}$/.test(value)) {
        value = "#" + [...value.slice(1)]
          .map(character => character + character)
          .join("");
      }

      return value.toUpperCase();
    }

    function isValidHex(value) {
      return /^#[0-9A-F]{6}$/.test(value);
    }

    function hexToRgb(hex) {
      return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
      };
    }

    function rgbTextToObject(value) {
      const numbers = value
        .split(",")
        .map(number => clamp(Number(number.trim()) || 0));

      if (numbers.length !== 3) {
        return null;
      }

      return {
        r: numbers[0],
        g: numbers[1],
        b: numbers[2]
      };
    }

    function rgbToHex({ r, g, b }) {
      return "#" + [r, g, b]
        .map(value => clamp(value).toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function rgbToText({ r, g, b }) {
      return `${clamp(r)}, ${clamp(g)}, ${clamp(b)}`;
    }

    function updateGroupFromColor(group) {
      const color = document.getElementById(group.color);
      const hex = document.getElementById(group.hex);
      const rgb = document.getElementById(group.rgb);

      const rgbValue = hexToRgb(color.value);

      hex.value = color.value.toUpperCase();
      rgb.value = rgbToText(rgbValue);
    }

    function updateGroupFromHex(group) {
      const color = document.getElementById(group.color);
      const hex = document.getElementById(group.hex);
      const rgb = document.getElementById(group.rgb);

      const normalizedHex = normalizeHex(hex.value);

      if (!isValidHex(normalizedHex)) {
        return;
      }

      const rgbValue = hexToRgb(normalizedHex);

      color.value = normalizedHex;
      hex.value = normalizedHex;
      rgb.value = rgbToText(rgbValue);
    }

    function updateGroupFromRgb(group) {
      const color = document.getElementById(group.color);
      const hex = document.getElementById(group.hex);
      const rgb = document.getElementById(group.rgb);

      const rgbValue = rgbTextToObject(rgb.value);

      if (!rgbValue) {
        return;
      }

      const newHex = rgbToHex(rgbValue);

      color.value = newHex;
      hex.value = newHex;
      rgb.value = rgbToText(rgbValue);
    }

    function calculateResult() {
      const sourceInitial = hexToRgb(
        document.getElementById("sourceInitialColor").value
      );

      const sourceResult = hexToRgb(
        document.getElementById("sourceResultColor").value
      );

      const targetInitial = hexToRgb(
        document.getElementById("targetInitialColor").value
      );

      let result;

      if (mode.value === "percentile") {
        result = {
          r: sourceInitial.r === 0
            ? 0
            : targetInitial.r * (sourceResult.r / sourceInitial.r),

          g: sourceInitial.g === 0
            ? 0
            : targetInitial.g * (sourceResult.g / sourceInitial.g),

          b: sourceInitial.b === 0
            ? 0
            : targetInitial.b * (sourceResult.b / sourceInitial.b)
        };

        modeDescription.textContent =
          "Percentile applies the proportional change between the known colors.";
      } else {
        result = {
          r: targetInitial.r + (sourceResult.r - sourceInitial.r),
          g: targetInitial.g + (sourceResult.g - sourceInitial.g),
          b: targetInitial.b + (sourceResult.b - sourceInitial.b)
        };

        modeDescription.textContent =
          "Absolute applies the exact RGB difference between the known colors.";
      }

      result = {
        r: clamp(result.r),
        g: clamp(result.g),
        b: clamp(result.b)
      };

      const resultHex = rgbToHex(result);
      const resultRgbText = rgbToText(result);

      targetResultColor.value = resultHex;
      targetResultHex.value = resultHex;
      targetResultRgb.value = resultRgbText;
      resultRgb.value = resultRgbText;
    }

    colorGroups.forEach(group => {
      const color = document.getElementById(group.color);
      const hex = document.getElementById(group.hex);
      const rgb = document.getElementById(group.rgb);

      color.addEventListener("input", () => {
        updateGroupFromColor(group);
        calculateResult();
      });

      hex.addEventListener("input", () => {
        updateGroupFromHex(group);
        calculateResult();
      });

      rgb.addEventListener("input", () => {
        updateGroupFromRgb(group);
        calculateResult();
      });
    });

    mode.addEventListener("change", calculateResult);

    document.getElementById("copyResult").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(resultRgb.value);
        copyMessage.textContent = "RGB result copied!";

        setTimeout(() => {
          copyMessage.textContent = "";
        }, 1500);
      } catch {
        copyMessage.textContent = "Unable to copy.";
      }
    });

    calculateResult();
  </script>
</body>
</html>

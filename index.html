<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RGB ↔ HEX</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="converter">
    <h1>RGB ↔ HEX</h1>

    <section class="section">
      <h2>RGB</h2>

      <div class="rgb-inputs">
        <label>
          Red
          <input id="red" type="number" min="0" max="255" value="52" />
        </label>

        <label>
          Green
          <input id="green" type="number" min="0" max="255" value="152" />
        </label>

        <label>
          Blue
          <input id="blue" type="number" min="0" max="255" value="219" />
        </label>
      </div>

      <div class="input-row rgb-output-row">
        <input id="rgbOutput" type="text" value="52, 152, 219"   />
        <button class="copy-button" data-copy="rgbOutput">Copy RGB</button>
      </div>
    </section>

    <div id="preview" class="color-preview"></div>

    <section class="section">
      <h2>HEX</h2>

      <div class="input-row">
        <input id="hex" type="text" value="#3498DB" maxlength="7" />
        <button class="copy-button" data-copy="hex">Copy HEX</button>
      </div>

      <div id="status" class="status"></div>
      <div id="copyMessage" class="copy-message"></div>
    </section>

    <a class="proportions-link" href="proportions.html">
      <span>Proportions</span>
      <span class="arrow">→</span>
    </a>
  </main>

  <script>
    const redInput = document.getElementById("red");
    const greenInput = document.getElementById("green");
    const blueInput = document.getElementById("blue");
    const rgbOutput = document.getElementById("rgbOutput");
    const hexInput = document.getElementById("hex");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const copyMessage = document.getElementById("copyMessage");

    function clamp(value, min = 0, max = 255) {
      return Math.min(max, Math.max(min, value));
    }

    function componentToHex(component) {
      return component.toString(16).padStart(2, "0").toUpperCase();
    }

    function updateFromRgb() {
      const red = clamp(Number(redInput.value) || 0);
      const green = clamp(Number(greenInput.value) || 0);
      const blue = clamp(Number(blueInput.value) || 0);

      redInput.value = red;
      greenInput.value = green;
      blueInput.value = blue;

      const rgb = `${red}, ${green}, ${blue}`;
      const hex =
        "#" +
        componentToHex(red) +
        componentToHex(green) +
        componentToHex(blue);

      rgbOutput.value = rgb;
      hexInput.value = hex;
      preview.style.backgroundColor = `rgb(${rgb})`;
      status.textContent = "";
    }

    function updateFromHex() {
      let hex = hexInput.value.trim();

      if (!hex.startsWith("#")) {
        hex = "#" + hex;
      }

      if (/^#[0-9a-fA-F]{3}$/.test(hex)) {
        hex = "#" + [...hex.slice(1)]
          .map((character) => character + character)
          .join("");
      }

      if (!/^#[0-9a-fA-F]{6}$/.test(hex)) {
        status.textContent = "Enter a valid HEX color, such as #3498DB.";
        return;
      }

      const red = parseInt(hex.slice(1, 3), 16);
      const green = parseInt(hex.slice(3, 5), 16);
      const blue = parseInt(hex.slice(5, 7), 16);

      redInput.value = red;
      greenInput.value = green;
      blueInput.value = blue;
      rgbOutput.value = `${red}, ${green}, ${blue}`;
      hexInput.value = hex.toUpperCase();
      preview.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;
      status.textContent = "";
    }
    
  function getRgbValuesFromText() {
  const input = rgbOutput.value.trim();
  let parts = [];

  if (input.includes(",")) {
    // Supports commas, spaces, or a combination:
    // 10, 50 30
    parts = input.split(",").flatMap((part) => {
      const trimmedPart = part.trim();

      // Preserve an empty comma-separated value as zero
      if (trimmedPart === "") {
        return [0];
      }

      return trimmedPart.split(/\s+/);
    });
  } else {
    // Supports space-separated values:
    // 200 30 60
    parts = input === "" ? [] : input.split(/\s+/);
  }

  const values = parts.slice(0, 3).map((value) => {
    if (value === "") {
      return 0;
    }

    const number = Number(value);

    return Number.isFinite(number)
      ? clamp(Math.round(number))
      : null;
  });

  // Missing RGB values become zero
  while (values.length < 3) {
    values.push(0);
  }

  return values.slice(0, 3);
}
function updateFromRgbText() {
  const values = getRgbValuesFromText();

  if (values.some((value) => value === null)) {
    status.textContent = "Enter RGB values like 52, 152, 219.";
    return;
  }

  const [red, green, blue] = values;

  redInput.value = red;
  greenInput.value = green;
  blueInput.value = blue;

  const hex =
    "#" +
    componentToHex(red) +
    componentToHex(green) +
    componentToHex(blue);

  // Do not rewrite rgbOutput.value here.
  // This keeps the cursor in its current position.
  hexInput.value = hex;
  preview.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;
  status.textContent = "";
}

function completeRgbInput() {
  const values = getRgbValuesFromText();

  if (values.some((value) => value === null)) {
    status.textContent = "Enter RGB values like 52, 152, 219.";
    return;
  }

  const [red, green, blue] = values;

  rgbOutput.value = `${red}, ${green}, ${blue}`;
  redInput.value = red;
  greenInput.value = green;
  blueInput.value = blue;

  const hex =
    "#" +
    componentToHex(red) +
    componentToHex(green) +
    componentToHex(blue);

  hexInput.value = hex;
  preview.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;
  status.textContent = "";
}

    [redInput, greenInput, blueInput].forEach((input) => {
      input.addEventListener("input", updateFromRgb);
    });

    
  rgbOutput.addEventListener("input", updateFromRgbText);
  rgbOutput.addEventListener("blur", completeRgbInput);

  rgbOutput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      completeRgbInput();
      rgbOutput.blur();
    }
  });

  hexInput.addEventListener("input", updateFromHex);

    document.querySelectorAll(".copy-button").forEach((button) => {
      button.addEventListener("click", async () => {
        const input = document.getElementById(button.dataset.copy);

        try {
          await navigator.clipboard.writeText(input.value);
          copyMessage.textContent = "Copied!";

          setTimeout(() => {
            copyMessage.textContent = "";
          }, 1500);
        } catch {
          copyMessage.textContent = "Unable to copy.";
        }
      });
    });

    updateFromRgb();
  </script>
</body>
</html>
